<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pragati_rnd_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var storageKey = "vite-ui-theme";
          var storedTheme = localStorage.getItem(storageKey);
          var theme = storedTheme === "dark" || storedTheme === "light" || storedTheme === "system"
            ? storedTheme
            : "system";
          var activeTheme = theme === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : theme;
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(activeTheme);
          document.documentElement.style.colorScheme = activeTheme;
        } catch (error) {
          document.documentElement.classList.add("light");
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <title>PRAGATI R&D - IIT Guwahati</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
